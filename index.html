<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Киселёв Денис - Лабораторная работа №5</title>

    <script>
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>

  <body>
    <header class="header">
      <h1>Киселёв Денис - Лабораторная работа №5</h1>

      <button id="themeButton" type="button">
        Сменить тему
      </button>
    </header>

    <main class="container">
      <section>
        <div class="section-head">
          <h2>Галерея</h2>

          <button id="reloadGallery" type="button">
            Обновить
          </button>
        </div>

        <div id="galleryContent"></div>
      </section>

      <section>
        <h2>Температура</h2>

        <form id="tempForm">
          <label for="room">Аудитория</label>
          <input id="room" name="room" required type="text" />

          <label for="temperature">Температура</label>
          <input
            id="temperature"
            name="temperature"
            required
            type="number"
            step="0.1"
          />

          <button id="submitButton" type="submit">
            Отправить
          </button>
        </form>
      </section>
    </main>

    <div id="toastContainer"></div>
  </body>
</html>
